<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050508;
      font-family: 'DM Sans', sans-serif;
    }

    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .scene {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 44px 36px;
      background: rgba(14,14,22,0.82);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      backdrop-filter: blur(32px);
      width: min(420px, 100%);
      animation: card-enter 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
      box-shadow: 0 0 0 1px rgba(124,77,255,0.12), 0 8px 48px rgba(0,0,0,0.6), 0 0 80px rgba(124,77,255,0.08);
      transition: box-shadow 0.4s ease, transform 0.4s ease;
    }
    .card:hover {
      box-shadow: 0 0 0 1px rgba(124,77,255,0.28), 0 12px 60px rgba(0,0,0,0.7), 0 0 120px rgba(124,77,255,0.18);
      transform: translateY(-2px);
    }
    @keyframes card-enter {
      from { opacity:0; transform: translateY(32px) scale(0.96); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    .card__eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(160,150,200,0.45);
    }
    .dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: #7c4dff; opacity: 0.7;
      animation: dot-pulse 2.4s ease-in-out infinite;
    }
    .dot:last-child { animation-delay: 1.2s; }
    @keyframes dot-pulse {
      0%,100% { opacity:0.4; transform:scale(1); }
      50%      { opacity:1;   transform:scale(1.4); }
    }

    .card__title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 10vw, 72px);
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #f0eeff 0%, #b39dff 50%, #00e5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 24px rgba(124,77,255,0.4));
    }

    .qr-shell {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 18px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.06), 0 0 32px rgba(124,77,255,0.3), 0 0 64px rgba(0,229,255,0.12);
      transition: box-shadow 0.4s ease;
    }
    .qr-shell:hover {
      box-shadow: 0 0 0 2px rgba(255,255,255,0.14), 0 0 48px rgba(124,77,255,0.55), 0 0 100px rgba(0,229,255,0.22);
    }

    .corner { position:absolute; z-index:10; width:22px; height:22px; }
    .corner--tl { top:-1px;    left:-1px;   border-top:2px solid #7c4dff;  border-left:2px solid #7c4dff;  border-radius:18px 0 0 0; }
    .corner--tr { top:-1px;    right:-1px;  border-top:2px solid #00e5ff;  border-right:2px solid #00e5ff; border-radius:0 18px 0 0; }
    .corner--bl { bottom:-1px; left:-1px;   border-bottom:2px solid #00e5ff; border-left:2px solid #00e5ff; border-radius:0 0 0 18px; }
    .corner--br { bottom:-1px; right:-1px;  border-bottom:2px solid #7c4dff; border-right:2px solid #7c4dff; border-radius:0 0 18px 0; }

    .qr-svg-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-svg-wrap svg {
      width: 100%;
      height: 100%;
    }

    .glow-ring {
      position:absolute; inset:-8px;
      border-radius:26px;
      border:1.5px solid transparent;
      background: linear-gradient(135deg,#7c4dff,#00e5ff,#ff4d94,#7c4dff) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      opacity:0;
      animation: ring-pulse 3s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes ring-pulse {
      0%,100%{opacity:0;} 50%{opacity:0.6;}
    }

    .card__url {
      display:flex; align-items:center; gap:8px;
      padding:8px 16px;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:100px;
      background:rgba(124,77,255,0.07);
      font-size:11px; color:rgba(200,195,230,0.7);
      letter-spacing:0.03em;
      font-family: monospace;
      transition: background 0.3s;
    }
    .card__url:hover { background:rgba(124,77,255,0.14); color:#f0eeff; }
    .url-icon { color:#00e5ff; font-size:13px; }

    .card__subtitle {
      font-size:13px; line-height:1.7; text-align:center;
      color:rgba(160,150,200,0.45); font-weight:300;
    }

    .progress-bar {
      width:100%; height:2px;
      background:rgba(255,255,255,0.06);
      border-radius:2px; overflow:hidden;
    }
    .progress-fill {
      height:100%; width:100%;
      background:linear-gradient(90deg,#7c4dff,#00e5ff);
      box-shadow:0 0 8px #00e5ff;
    }
  </style>
</head>

<script>
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles;
  const COLORS = ['rgba(124,77,255,','rgba(0,229,255,','rgba(255,77,148,'];
  function resize() { W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  function make(n) {
    return Array.from({length:n},()=>({
      x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,
      vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,
      alpha:Math.random()*.5+.1,color:COLORS[Math.floor(Math.random()*3)]
    }));
  }
  function tick() {
    ctx.clearRect(0,0,W,H);
    for(const p of particles){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color+p.alpha+')';ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  resize(); particles=make(90); tick();
  window.addEventListener('resize',()=>{resize();particles=make(90);});

  // Tilt
  const card = document.getElementById('card');
  card.addEventListener('mousemove',e=>{
    const rect=card.getBoundingClientRect();
    const dx=(e.clientX-rect.left-rect.width/2)/(rect.width/2);
    const dy=(e.clientY-rect.top-rect.height/2)/(rect.height/2);
    card.style.transform=`translateY(-2px) scale(1.005) rotateY(${dx*4}deg) rotateX(${-dy*4}deg)`;
    card.style.transition='transform 0.1s ease';
  });
  card.addEventListener('mouseleave',()=>{
    card.style.transform='';
    card.style.transition='box-shadow 0.4s ease,transform 0.4s ease';
  });
})();
</script>
